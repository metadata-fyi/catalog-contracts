name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile catalog-release.py validate-source.py validate-normalized.py
      - run: python3 validate-normalized.py fixtures/original.json
      - run: python3 tests/catalog-ownership-e2e.py
      - run: python3 tests/catalog-normalized-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-e2e-${{ github.sha }}
          path: outputs/catalog-architecture/*.json
          retention-days: 14
